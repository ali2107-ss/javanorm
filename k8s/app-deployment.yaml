apiVersion: apps/v1
kind: Deployment
metadata:
  name: normacontrol-api
  namespace: normacontrol
spec:
  replicas: 2
  selector:
    matchLabels:
      app: normacontrol-api
  template:
    metadata:
      labels:
        app: normacontrol-api
    spec:
      containers:
        - name: api
          image: normacontrol:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: normacontrol-secrets
                  key: datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: normacontrol-secrets
                  key: datasource-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: normacontrol-secrets
                  key: datasource-password
            - name: SPRING_REDIS_HOST
              value: redis
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: MINIO_ENDPOINT
              value: http://minio:9000
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: normacontrol-api
  namespace: normacontrol
spec:
  selector:
    app: normacontrol-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
