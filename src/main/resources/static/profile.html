<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>НормаКонтроль - Профиль</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script src="app.js"></script>
  <script>renderSidebar();</script>
  
  <div class="layout">
    <div class="topbar">
      <div class="topbar-title">Профиль пользователя</div>
    </div>
    
    <div class="content">
      <div style="display: flex; gap: 24px;">
        <div class="card" style="width: 300px; text-align: center; animation: fadeIn 0.4s ease;">
          <div id="profInitials" style="width: 100px; height: 100px; background: var(--accent); color: white; border-radius: 50%; font-size: 36px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">П</div>
          <h2 id="profName" style="margin-bottom: 8px;">Пользователь</h2>
          <div id="profEmail" style="color: var(--text-gray); margin-bottom: 16px;">email@example.com</div>
          <div id="profRole" class="badge warning" style="margin-bottom: 24px;">USER</div>
          
          <button class="btn btn-outline" style="width: 100%;" onclick="changePassword()">Изменить пароль</button>
        </div>
        
        <div class="card" style="flex: 1; animation: slideIn 0.6s ease;">
          <h3 style="font-size: 18px; margin-bottom: 24px;">Личная статистика</h3>
          
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px;">
            <div style="background: var(--bg-secondary); padding: 16px; border-radius: 12px; text-align: center;">
              <div id="checkedCount" style="font-size: 28px; font-weight: bold; color: var(--accent);">0</div>
              <div style="color: var(--text-gray); font-size: 13px;">Проверено</div>
            </div>
            <div style="background: var(--bg-secondary); padding: 16px; border-radius: 12px; text-align: center;">
              <div id="averageScore" style="font-size: 28px; font-weight: bold; color: var(--success);">0</div>
              <div style="color: var(--text-gray); font-size: 13px;">Средний балл</div>
            </div>
            <div style="background: var(--bg-secondary); padding: 16px; border-radius: 12px; text-align: center;">
              <div id="documentsCount" style="font-size: 28px; font-weight: bold; color: #007AFF;">0</div>
              <div style="color: var(--text-gray); font-size: 13px;">Документов в базе</div>
            </div>
          </div>
          
          <h3 style="font-size: 16px; margin-bottom: 16px;">Настройки уведомлений</h3>
          <div style="display: flex; flex-direction: column; gap: 16px;">
            <label style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 16px; cursor: pointer;">
              <div>
                <div style="font-weight: 500;">Email-отчёты</div>
                <div style="font-size: 13px; color: var(--text-gray);">Получать PDF-отчёт на почту после проверки</div>
              </div>
              <input id="emailReportsEnabled" type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--accent);">
            </label>
            <label style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; cursor: pointer;">
              <div>
                <div style="font-weight: 500;">Уведомления о нововведениях ГОСТ</div>
                <div style="font-size: 13px; color: var(--text-gray);">Рассылка об изменениях в алгоритмах</div>
              </div>
              <input id="gostUpdatesEnabled" type="checkbox" style="width: 18px; height: 18px; accent-color: var(--accent);">
            </label>
          </div>
          
          <button class="btn btn-primary" style="margin-top: 16px;" onclick="saveNotificationSettings()">Сохранить изменения</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    if (checkAuth()) {
      initProfile();
    }

    async function initProfile() {
      const fallback = getUserInfo();
      const profile = await apiCall('/api/v1/users/me') || {};
      const roles = Array.isArray(profile.roles) ? profile.roles.join(', ') : (fallback.role || 'USER');
      const name = profile.fullName || profile.username || fallback.name;
      const initials = (name || fallback.name || 'U').slice(0, 2).toUpperCase();

      document.getElementById('profInitials').textContent = initials;
      document.getElementById('profName').textContent = name;
      document.getElementById('profEmail').textContent = profile.email || fallback.email || 'Не указан';
      
      const r = document.getElementById('profRole');
      r.textContent = roles;
      if (roles.includes('ADMIN')) {
        r.className = 'badge danger';
      } else {
        r.className = 'badge';
        r.style.background = '#E5F1FF';
        r.style.color = '#007AFF';
      }

      const stats = await apiCall('/api/v1/users/me/stats');
      if (stats) {
        animateCount(document.getElementById('checkedCount'), stats.checkedCount || 0);
        animateCount(document.getElementById('averageScore'), Math.round(stats.averageScore || 0));
        animateCount(document.getElementById('documentsCount'), stats.documentsCount || 0);
      }

      const settings = await apiCall('/api/v1/users/me/notification-settings');
      if (settings) {
        document.getElementById('emailReportsEnabled').checked = !!settings.emailReportsEnabled;
        document.getElementById('gostUpdatesEnabled').checked = !!settings.gostUpdatesEnabled;
      }
    }

    async function changePassword() {
      const currentPassword = prompt('Введите текущий пароль');
      if (!currentPassword) return;
      const newPassword = prompt('Введите новый пароль (минимум 8 символов)');
      if (!newPassword) return;
      if (newPassword.length < 8) {
        showToast('Новый пароль должен быть не короче 8 символов', 'error');
        return;
      }

      const result = await apiCall('/api/v1/users/me/password', {
        method: 'PATCH',
        body: JSON.stringify({ currentPassword, newPassword })
      });
      if (result !== null) {
        showToast('Пароль изменён', 'success');
      } else {
        showToast('Не удалось изменить пароль', 'error');
      }
    }

    async function saveNotificationSettings() {
      const result = await apiCall('/api/v1/users/me/notification-settings', {
        method: 'PATCH',
        body: JSON.stringify({
          emailReportsEnabled: document.getElementById('emailReportsEnabled').checked,
          gostUpdatesEnabled: document.getElementById('gostUpdatesEnabled').checked
        })
      });
      if (result) {
        showToast('Настройки сохранены', 'success');
      } else {
        showToast('Не удалось сохранить настройки', 'error');
      }
    }
  </script>
</body>
</html>
